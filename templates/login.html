<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión – Sistema Miller</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #1a2b4a; min-height: 100vh; display:flex; align-items:center; justify-content:center; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .brand-logo { font-size: 2.5rem; color: #f0a500; }
  </style>
</head>
<body>
<div class="card" style="width:380px;">
  <div class="card-body p-5">
    <div class="text-center mb-4">
      <i class="bi bi-lightning-charge-fill brand-logo"></i>
      <h4 class="fw-bold mt-2 mb-0">Electrodomésticos Miller</h4>
      <small class="text-muted">Sistema de Inventario</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold">
        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
      </button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

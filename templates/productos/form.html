{% extends 'base.html' %}
{% block title %}{{ accion }} Producto – Miller{% endblock %}
{% block page_title %}{{ accion }} Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Código <span class="text-muted small">(dejar vacío para autogenerar)</span></label>
            <input type="text" name="codigo" class="form-control"
                   value="{{ producto.codigo if producto else '' }}"
                   {% if accion == 'Editar' %}readonly{% endif %}>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control" required
                   value="{{ producto.nombre if producto else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Categoría <span class="text-danger">*</span></label>
            <select name="categoria_id" class="form-select" required>
              <option value="">Seleccione...</option>
              {% for c in categorias %}
                <option value="{{ c.id }}"
                  {% if producto and producto.categoria_id == c.id %}selected{% endif %}>
                  {{ c.nombre }}
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Unidad</label>
              <select name="unidad" class="form-select">
                {% for u in ['UND', 'PAR', 'KIT', 'SET', 'M2'] %}
                  <option {% if producto and producto.unidad == u %}selected{% endif %}>{{ u }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label fw-semibold">Stock mínimo</label>
              <input type="number" name="stock_minimo" class="form-control" min="0" step="1"
                     value="{{ producto.stock_minimo if producto else 0 }}">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea name="descripcion" class="form-control" rows="2">{{ producto.descripcion if producto else '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
            <a href="{{ url_for('productos.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
